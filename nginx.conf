server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite's hashed build files never change; cache them for a year.
  location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|png|jpe?g|svg|webp|woff2?)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Unhashed images from public/ (trees, moon maps): cache for a week.
  location /assets/ {
    try_files $uri =404;
    expires 7d;
  }

  location = /health {
    access_log off;
    return 200 "ok";
  }

  # Single-page app: /admin, /tasarim/<slug>, /<template>/<couple> all load index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
